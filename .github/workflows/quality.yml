name: Verificación de calidad

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend compilable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings 100
      - run: npm run build
